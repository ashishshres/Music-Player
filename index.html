<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎵 MP3 Search & Play (JioSaavn)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; }
    .results { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; border-top: 1px solid #ddd; }
    .results li { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .results li:hover { background: #f0f0f0; }
    audio { width: 100%; margin-top: 20px; }
    .now-playing { font-weight: bold; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎧 Search & Play MP3 (Saavn)</h2>
    <input id="searchBox" placeholder="Type a song..." autocomplete="off" />
    <ul class="results" id="resultsList"></ul>
    <div class="now-playing" id="nowPlaying">No song playing</div>
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <script>
    const searchBox = document.getElementById("searchBox");
    const resultsList = document.getElementById("resultsList");
    const audioPlayer = document.getElementById("audioPlayer");
    const nowPlaying = document.getElementById("nowPlaying");
    let searchTimeout;

    searchBox.addEventListener("input", () => {
      clearTimeout(searchTimeout);
      const query = searchBox.value.trim();
      if (query.length < 2) {
        resultsList.innerHTML = '';
        return;
      }
      searchTimeout = setTimeout(() => searchSongs(query), 300); // debounce
    });

    async function searchSongs(query) {
      try {
        const res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}`);
        const data = await res.json();
        const songs = data.data.results;
        showResults(songs);
      } catch (e) {
        console.error("Error fetching songs:", e);
        resultsList.innerHTML = '<li>Error fetching songs</li>';
      }
    }

    function showResults(songs) {
      resultsList.innerHTML = '';
      songs.forEach(song => {
        const li = document.createElement('li');
        const artist = song.primaryArtists || 'Unknown Artist';
        li.textContent = `${song.name} — ${artist}`;
        li.addEventListener('click', () => {
          const audioUrl = song.downloadUrl?.[song.downloadUrl.length - 1]?.link;
          if (audioUrl) {
            audioPlayer.src = audioUrl;
            nowPlaying.textContent = `▶️ Playing: ${song.name} — ${artist}`;
          } else {
            nowPlaying.textContent = '❌ MP3 not available for this track';
          }
        });
        resultsList.appendChild(li);
      });
    }
  </script>
</body>
</html>
