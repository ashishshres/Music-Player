<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouTube Music Search & Play</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background:#f0f0f0; padding:20px; }
  .container { max-width: 600px; margin:auto; background:#fff; border-radius:10px; padding:20px; box-shadow:0 0 15px rgba(0,0,0,0.1);}
  input { width: 100%; padding:12px; font-size:16px; border-radius:6px; border:1px solid #ccc;}
  ul { list-style:none; padding:0; margin-top:10px; max-height:300px; overflow-y:auto; }
  li { padding:10px; border-bottom:1px solid #eee; cursor:pointer; display:flex; align-items:center; gap:10px; }
  li:hover { background:#f9f9f9; }
  img { width: 60px; height: 40px; object-fit: cover; border-radius: 4px; }
  iframe { margin-top:20px; width: 100%; aspect-ratio: 16/9; border:none; border-radius:10px; }
  .controls { margin-top: 10px; display:flex; gap:10px; justify-content:center; }
  button { padding:10px 15px; font-size:16px; border:none; background:#007BFF; color:#fff; border-radius:6px; cursor:pointer; }
  button:disabled { background:#aaa; cursor:default; }
  label { margin-left: 15px; font-size: 14px; }
</style>
</head>
<body>
  <div class="container">
    <h2>🔍 Search & Play YouTube Songs</h2>
    <input id="searchInput" placeholder="Type song name..." autocomplete="off" />
    <ul id="results"></ul>

    <iframe id="player" allowfullscreen></iframe>

    <div class="controls">
      <button id="prevBtn" disabled>Prev</button>
      <button id="playPauseBtn" disabled>Pause</button>
      <button id="nextBtn" disabled>Next</button>
      <label>
        Auto Pause after (seconds):
        <input id="pauseTime" type="number" min="0" value="0" style="width:60px" />
      </label>
    </div>
  </div>

<script>
  const searchInput = document.getElementById("searchInput");
  const resultsList = document.getElementById("results");
  const player = document.getElementById("player");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const playPauseBtn = document.getElementById("playPauseBtn");
  const pauseTimeInput = document.getElementById("pauseTime");

  let results = [];
  let currentIndex = -1;
  let isPlaying = false;
  let pauseTimeout;

  searchInput.addEventListener("input", async () => {
    const query = searchInput.value.trim();
    if (query.length < 2) {
      resultsList.innerHTML = "";
      return;
    }

    try {
      const res = await fetch(`http://localhost:3000/search?q=${encodeURIComponent(query)}`);
      const data = await res.json();
      results = data.results;
      currentIndex = -1;
      renderResults();
      updateControls();
      stopVideo();
    } catch (err) {
      resultsList.innerHTML = "<li>Error loading results</li>";
    }
  });

  function renderResults() {
    resultsList.innerHTML = results.map((item, i) => `
      <li data-index="${i}">
        <img src="${item.thumbnail}" alt="thumb" />
        ${item.title}
      </li>
    `).join("");

    // add click handlers
    resultsList.querySelectorAll("li").forEach(li => {
      li.addEventListener("click", () => {
        const i = +li.dataset.index;
        playVideo(i);
      });
    });
  }

  function playVideo(index) {
    if (index < 0 || index >= results.length) return;
    currentIndex = index;
    const videoId = results[index].videoId;
    player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
    isPlaying = true;
    updateControls();
    setupAutoPause();
  }

  function stopVideo() {
    player.src = "";
    isPlaying = false;
    updateControls();
    clearTimeout(pauseTimeout);
  }

  function updateControls() {
    prevBtn.disabled = currentIndex <= 0;
    nextBtn.disabled = currentIndex >= results.length - 1 || currentIndex === -1;
    playPauseBtn.disabled = currentIndex === -1;

    playPauseBtn.textContent = isPlaying ? "Pause" : "Play";
  }

  prevBtn.addEventListener("click", () => {
    if (currentIndex > 0) playVideo(currentIndex - 1);
  });

  nextBtn.addEventListener("click", () => {
    if (currentIndex < results.length - 1) playVideo(currentIndex + 1);
  });

  playPauseBtn.addEventListener("click", () => {
    if (isPlaying) {
      pauseVideo();
    } else {
      resumeVideo();
    }
  });

  function pauseVideo() {
    // Send postMessage to YouTube iframe to pause
    player.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    isPlaying = false;
    updateControls();
    clearTimeout(pauseTimeout);
  }

  function resumeVideo() {
    player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    isPlaying = true;
    updateControls();
    setupAutoPause();
  }

  function setupAutoPause() {
    clearTimeout(pauseTimeout);
    const secs = parseInt(pauseTimeInput.value);
    if (secs > 0) {
      pauseTimeout = setTimeout(() => {
        pauseVideo();
        alert(`Paused after ${secs} seconds`);
      }, secs * 1000);
    }
  }
</script>
</body>
</html>
